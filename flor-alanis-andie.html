<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Alanis Andie 🌼</title>
<style>
  :root{
    --bg1:#fff7e0;
    --bg2:#ffe9b3;
    --petal:#ffd93d;
    --petal-dark:#ffc400;
    --center:#f7931e;
    --center-dark:#e07b00;
    --stem:#4caf50;
    --stem-dark:#357a33;
    --text:#6b4b00;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#3a2c00;
      --bg2:#5a4300;
      --text:#ffe9b3;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:body-bg-fallback;
  }
  body{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.5rem;
    background:radial-gradient(circle at 50% 30%, var(--bg2), var(--bg1));
    font-family:'Segoe UI', Verdana, sans-serif;
    overflow-x:hidden;
    padding:2rem 1rem;
  }

  .escena{
    position:relative;
    width:min(90vw, 340px);
    aspect-ratio:1/1.3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .maceta-sombra{
    position:absolute;
    bottom:6%;
    width:70%;
    height:14px;
    background:rgba(0,0,0,0.15);
    border-radius:50%;
    filter:blur(4px);
  }

  .planta{
    position:relative;
    width:100%;
    height:100%;
    transform-origin:bottom center;
    animation:vientoSuave 4.5s ease-in-out infinite;
  }

  @keyframes vientoSuave{
    0%,100%{ transform: rotate(-2deg); }
    50%{ transform: rotate(2deg); }
  }

  .tallo{
    position:absolute;
    left:50%;
    bottom:8%;
    width:10px;
    height:55%;
    background:linear-gradient(to top, var(--stem-dark), var(--stem));
    transform:translateX(-50%);
    border-radius:6px;
  }

  .hoja{
    position:absolute;
    width:46px;
    height:26px;
    background:linear-gradient(135deg, var(--stem), var(--stem-dark));
    border-radius:0 100% 0 100%;
    animation:aleteo 3s ease-in-out infinite;
  }
  .hoja.izq{
    left:calc(50% - 44px);
    bottom:28%;
    transform:rotate(-15deg);
    animation-delay:0.3s;
  }
  .hoja.der{
    left:calc(50% + 2px);
    bottom:20%;
    transform:rotate(200deg);
    animation-delay:0.6s;
  }
  @keyframes aleteo{
    0%,100%{ transform: rotate(var(--r,-15deg)) scale(1); }
    50%{ transform: rotate(var(--r,-15deg)) scale(1.06); }
  }

  .flor{
    position:absolute;
    left:50%;
    bottom:60%;
    transform:translateX(-50%);
    width:190px;
    height:190px;
    animation:latido 3.2s ease-in-out infinite;
  }
  @keyframes latido{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.045); }
  }

  .petalos{
    position:absolute;
    inset:0;
    animation:girar 18s linear infinite;
  }
  @keyframes girar{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .petalo{
    position:absolute;
    left:50%;
    top:50%;
    width:46px;
    height:82px;
    margin-left:-23px;
    margin-top:-72px;
    background:radial-gradient(ellipse at 50% 85%, var(--petal-dark), var(--petal) 60%, #fff6cc 100%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    transform-origin:50% 100%;
    box-shadow:0 0 12px rgba(255,193,7,0.35);
  }

  .centro{
    position:absolute;
    left:50%;
    top:50%;
    width:70px;
    height:70px;
    margin-left:-35px;
    margin-top:-35px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd76b, var(--center) 55%, var(--center-dark) 100%);
    box-shadow:inset 0 0 10px rgba(150,80,0,0.4), 0 0 18px rgba(255,180,0,0.5);
    z-index:2;
  }
  .centro::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background-image:
      radial-gradient(circle, var(--center-dark) 2px, transparent 2.5px);
    background-size:9px 9px;
    opacity:0.55;
  }

  .brillo{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .destello{
    position:absolute;
    width:6px;
    height:6px;
    background:#fff6c9;
    border-radius:50%;
    opacity:0;
    animation:centellear 2.6s ease-in-out infinite;
    box-shadow:0 0 6px 2px rgba(255,246,180,0.8);
  }
  .destello:nth-child(1){ top:8%; left:20%; animation-delay:0s; }
  .destello:nth-child(2){ top:15%; left:75%; animation-delay:0.7s; }
  .destello:nth-child(3){ top:70%; left:85%; animation-delay:1.3s; }
  .destello:nth-child(4){ top:80%; left:10%; animation-delay:1.9s; }
  @keyframes centellear{
    0%,100%{ opacity:0; transform:scale(0.5); }
    50%{ opacity:1; transform:scale(1.2); }
  }

  .texto{
    text-align:center;
  }
  .titulo{
    font-size:clamp(1.4rem, 5vw, 2rem);
    color:var(--text);
    font-weight:700;
    margin:0 0 .3rem 0;
    letter-spacing:.5px;
  }
  .nombre{
    font-family:'Brush Script MT', 'Segoe Script', cursive;
    font-size:clamp(2.2rem, 8vw, 3.2rem);
    background:linear-gradient(90deg, #f7931e, #ffd93d, #f7931e);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:brilloTexto 3s linear infinite;
    margin:0;
  }
  @keyframes brilloTexto{
    to{ background-position:200% center; }
  }
  .subtitulo{
    color:var(--text);
    opacity:.85;
    font-size:.95rem;
    margin-top:.4rem;
  }
</style>
</head>
<body>

  <div class="escena">
    <div class="planta">
      <div class="tallo"></div>
      <div class="hoja izq" style="--r:-15deg"></div>
      <div class="hoja der" style="--r:200deg"></div>
      <div class="flor">
        <div class="petalos" id="petalos"></div>
        <div class="centro"></div>
        <div class="brillo">
          <div class="destello"></div>
          <div class="destello"></div>
          <div class="destello"></div>
          <div class="destello"></div>
        </div>
      </div>
    </div>
    <div class="maceta-sombra"></div>
  </div>

  <div class="texto">
    <p class="titulo">Para ti</p>
    <p class="nombre">Alanis Andie</p>
    <p class="subtitulo">🌼 con cariño 🌼</p>
  </div>

<script>
  // Genera los pétalos alrededor del centro
  const contenedor = document.getElementById('petalos');
  const totalPetalos = 10;
  for (let i = 0; i < totalPetalos; i++) {
    const petalo = document.createElement('div');
    petalo.className = 'petalo';
    const angulo = (360 / totalPetalos) * i;
    petalo.style.transform = `rotate(${angulo}deg)`;
    contenedor.appendChild(petalo);
  }
</script>
</body>
</html>
